<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>My Money Dashboard</h1>
  <p class="subtitle">Manage your money wisely.</p>
  <div class="container">
    <div class="income">
      <h2 id="income-title">My Income</h2>
      <label for="income-input">Enter your income:</label>
      <input type="number" id="income-input" placeholder="e.g. 2500" min="0" step="0.01">
      <label for="income-category">Category:</label>
      <select id="income-category">
        <option>Salary</option>
        <option>Freelance</option>
        <option>Other income</option>
      </select>
      <button id="add-income">Add Income</button>
      <p class="error" id="income-error" role="alert"></p>
      <p>Total Income: <span id="total-income">€0.00</span></p>
      <ul id="income-list"></ul>
    </div>
    <div class="expenses">
      <h2>My Expenses</h2>
      <label for="expense-input">Enter your expense:</label>
      <input type="number" id="expense-input" placeholder="e.g. 100" min="0" step="0.01">
      <label for="expense-category">Category:</label>
      <select id="expense-category">
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Other</option>
      </select>
      <button id="add-expense">Add Expense</button>
      <p class="error" id="expense-error" role="alert"></p>
      <p>Total Expenses: <span id="total-expenses">€0.00</span></p>
      <ul id="expense-list"></ul>
    </div>
    <div class="balance">
      <h2>My Balance</h2>
      <p>My Balance: <span id="total-balance">€0.00</span></p>
      <p class="hint">Income minus expenses. Your entries are saved in this browser.</p>
    </div>
  </div>
  <script src="script.js?v=5"></script>
</body>
</html>
